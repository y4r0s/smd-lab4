name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Этап 1. Сборка: зависимости, линтер, проверка типов (промпт 3.3.1)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер (flake8)
        run: flake8 app tests

      - name: Проверка типов (mypy)
        run: mypy app

  # Этап 2. Тесты: pytest + отчёт о покрытии (промпт 3.3.2)
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Тесты (pytest) с покрытием
        run: pytest --cov=app --cov-report=term --cov-report=xml --junitxml=pytest.xml

      - name: Публикация отчётов о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest.xml
            coverage.xml

  # Этап 3. Публикация: сборка образа и push в GHCR (промпт 3.3.3)
  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
